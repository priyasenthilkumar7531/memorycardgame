<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🧠 Memory Card Game</h1>

<div class="controls">
  <div class="control-group">
    <label>Difficulty:</label>
    <select id="difficulty">
      <option value="easy"selected>Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>
  
  <div class="control-group">
    <label>Theme:</label>
    <select id="theme">
      <option value="fruits">Fruits</option>
      <option value="vegetables">Vegetables</option>
      <option value="flowers">Flowers</option>
      <option value="animals">Animals</option>
      <option value="birds">Birds</option>
      <option value="emojis">Emojis</option>
    </select>
  </div>
  
  <div class="button-group">
    <button id="startBtn">Start Game</button>
    <button id="resetBtn">Reset</button>
  </div>
  
  <div class="stats">
    <h3>💰 Coins: <span id="coins">0</span></h3>
    <h3>🎯 Level: <span id="currentLevelDisplay">1</span></h3>
    <h3>⏱️ <span id="timer">0:00</span></h3>
    <h3>🏆 Best: <span id="bestMoves">-</span> | Memory: <span id="memoryRate">0%</span></h3>
    <h3 id="score"></h3>
  </div>
</div>

 
<div class="level-selector">
  <h3>Select Level: <span id="selectedLevelDisplay" class="level-highlight">1</span></h3>
  <div class="level-buttons" id="levelButtons">
  </div>
</div>


<div id="board"></div>
<div id="result"></div>

<div id="continuePopup" class="popup-overlay">
  <div class="popup-content">
    <h2>⏰ Time's Up!</h2>
    <p id="popupMessage">You have <span id="remainingCards">0</span> cards remaining</p>
    <p class="popup-cost">💰 Cost: 100 coins</p>
    <p class="popup-coins">Your coins: <span id="popupCoins">0</span></p>
    <div class="popup-buttons">
      <button id="continueBtn" class="popup-btn continue">✅ Continue (100 coins)</button>
      <button id="restartBtn" class="popup-btn restart">🔄 Restart Level</button>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
